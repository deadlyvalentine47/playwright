name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Which GitHub Environment to run against
        type: choice
        options: [qa, stage, prod]
        default: qa
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails the build on a type error. `playwright test` transpiles and ignores
  # types, so without this a nested type can disagree with flat JSON and every
  # test still passes. Runs once, no browser needed.
  typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # Public suite: targets one public site, needs no credentials. The URL comes
  # from the selected GitHub Environment as a variable, same as bolt and sauce.
  # Sharded across 2 runners because the site is slow and occasionally serves a
  # challenge page, so a whole job's worth of tests is not lost to one bad load.
  blogspot:
    needs: typecheck
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    environment: ${{ inputs.target || 'qa' }}
    env:
      CI: true
      APP_ENV: ${{ inputs.target || 'qa' }}
      # A file that does not exist: in CI nothing is read from disk.
      ENV_FILE: .env.missing
      # from the selected GitHub Environment, same as bolt and sauce
      BLOGSPOT_BASE_URL: ${{ vars.BLOGSPOT_BASE_URL }}
      WORKERS: 2
      RETRIES: 2
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Some images set NODE_ENV=production, which makes npm skip every
      # devDependency — and every dependency here is one.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate environment
        run: npx tsx scripts/check-env.ts blogspot

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run blogspot suite (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --project=blogspot --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogspot-report-${{ matrix.shardIndex }}
          path: |
            reports/
            screenshots/
          retention-days: 14

  # Authenticated suite. The GitHub Environment named here is the single source
  # of truth: it supplies BOLT_BASE_URL (a variable — it is not a secret) and the
  # credentials (a secret). BLOGSPOT_BASE_URL is absent on purpose — this project
  # never touches it.
  bolt:
    needs: typecheck
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    environment: ${{ inputs.target || 'qa' }}
    env:
      CI: true
      APP_ENV: ${{ inputs.target || 'qa' }}
      ENV_FILE: .env.missing
      # URLs are variables: a public host is not a secret, and variables are
      # readable in the UI so nobody has to guess what an environment points at.
      BOLT_BASE_URL: ${{ vars.BOLT_BASE_URL }}
      BOLT_LOGIN_JSON: ${{ secrets.BOLT_LOGIN_JSON }}
      BOLT_AUTH_STATE: .auth/bolt.json
      WORKERS: 1
      RETRIES: 2
      # Turn on when every hostname contains its environment name (api.qa...,
      # api.stage...). Catches a stage build running QA config.
      URL_MUST_CONTAIN_ENV: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate environment
        run: npx tsx scripts/check-env.ts bolt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write credentials
        run: printf '%s' "$BOLT_LOGIN_JSON" > testdata/bolt/login.json

      - name: Run authenticated suite
        run: npx playwright test --project=bolt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolt-report-${{ inputs.target || 'qa' }}
          path: |
            reports/
            screenshots/
          retention-days: 14

  # Public suite, own job so it fails independently. The URL comes from the
  # selected GitHub Environment as a variable — same pattern as bolt and blogspot.
  sauce:
    needs: typecheck
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    environment: ${{ inputs.target || 'qa' }}
    env:
      CI: true
      APP_ENV: ${{ inputs.target || 'qa' }}
      ENV_FILE: .env.missing
      SAUCE_DEMO_URL: ${{ vars.SAUCE_DEMO_URL }}
      WORKERS: 4
      RETRIES: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate environment
        run: npx tsx scripts/check-env.ts sauce

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run sauce suite
        run: npx playwright test --project=sauce

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-report
          path: |
            reports/
            screenshots/
          retention-days: 14
